<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="game-version" content="2026-11-17-difficulty-v3" />
<title>旋转公约数 · 模拟试玩</title>
<style>
  :root{--bg:#0b1020;--panel:#131b31;--ink:#eef3ff;--muted:#98a8c8;--accent:#ff4d4d;--accent2:#ff9f43;--line:#2c3b61;--good:#36d399}
  *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 20% 0%,#21345d 0,#0b1020 42%);color:var(--ink);font-family:Inter,"Microsoft YaHei",sans-serif;min-height:100vh}
  .wrap{max-width:1120px;margin:auto;padding:28px 20px 40px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.eyebrow{color:var(--accent2);font-weight:700;letter-spacing:.12em;font-size:13px}.title{font-size:clamp(28px,5vw,48px);margin:8px 0 0}.sub{color:var(--muted);margin:8px 0 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px}.board-card,.side{background:rgba(19,27,49,.92);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px #0004}.board-card{padding:20px}.board-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.status{font-weight:700}.timer{font-variant-numeric:tabular-nums;color:var(--accent2);font-size:22px;font-weight:800}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:650px;margin:auto;position:relative}.cell{aspect-ratio:1;border:1px solid #32456f;background:linear-gradient(145deg,#26385e,#182541);border-radius:12px;display:grid;place-items:center;font-size:clamp(18px,3.4vw,32px);font-weight:800;position:relative;cursor:default;user-select:none}.cell .mini{position:absolute;bottom:4px;right:7px;font-size:10px;color:#7c8daf;font-weight:500}.cell.goal{box-shadow:inset 0 0 0 2px var(--good)}.rotate-button{position:absolute;z-index:3;width:31px;height:31px;border:2px solid #ff9696;border-radius:50%;background:#e43f4e;color:#fff;font-size:20px;line-height:25px;text-align:center;font-weight:900;box-shadow:0 3px 10px #0009;cursor:pointer;transform:translate(-50%,-50%);padding:0}.rotate-button:hover{background:#ff6570;transform:translate(-50%,-50%) scale(1.1)}.controls{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px;justify-content:center}.btn{border:1px solid var(--line);background:#202e4d;color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(1.15)}.btn.primary{background:var(--accent);border-color:#ff7777;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.side{padding:20px}.side h2{font-size:18px;margin:0 0 14px}.stat{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #263454;color:var(--muted)}.stat strong{color:var(--ink)}.rules{line-height:1.7;color:#c5d0e7;font-size:14px}.rules b{color:#fff}.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.tag{padding:9px;border:1px solid var(--line);border-radius:9px;background:#182541;color:#b7c5e3;font-size:13px}.notice{margin-top:18px;padding:12px;border-radius:10px;background:#251d21;color:#ffc6bd;font-size:13px;line-height:1.5}.difficulty{display:flex;gap:8px;margin-top:10px}.difficulty button{flex:1}.win{color:var(--good)!important}.hint{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.5}
  @media(max-width:800px){.layout{grid-template-columns:1fr}.top{display:block}.side{order:-1}.board{max-width:560px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top"><div><div class="eyebrow">多人竞技模拟器 · 80进50</div><h1 class="title">旋转公约数</h1><p class="sub">先判断归类，再用局部旋转把同类数字连成一片。</p></div><div class="timer" id="timer">00:00.0</div></header>
  <section class="layout">
    <div class="board-card"><div class="board-head"><div class="status" id="status">点击“开始本题”进入挑战</div><div>步数 <strong id="moves">0</strong><button class="btn" id="answer">显示答案</button><button class="btn" id="categories">隐藏分类</button></div></div><div class="board" id="board"></div><div class="controls"><button class="btn primary" id="start">开始本题</button><button class="btn" id="undo" disabled>撤销</button><button class="btn" id="reset" disabled>重置本题</button><button class="btn" id="new" disabled>换一道题</button><button class="btn" id="auto">自动解答</button></div></div>
    <aside class="side"><h2>本局信息</h2><div class="stat"><span>盘面</span><strong>5 × 5</strong></div><div class="stat"><span>隐藏分类</span><strong>5 类</strong></div><div class="stat"><span>目标</span><strong>全部连通</strong></div><div class="legend"><div class="tag">🔴 ↻：可旋转位置</div><div class="tag">彩色边框：同色为同类，已连通</div></div><div class="rules"><p><b>操作：</b>点击四个数字块中间的红色 ↻ 按钮，周围四格顺时针旋转90°。</p><p><b>通关：</b>相同公约数类别的数字必须上下左右连成一片，所有类别同时满足才算完成。</p></div><div class="difficulty"><button class="btn" data-level="easy">低 · 5×5</button><button class="btn primary" data-level="normal">中 · 6×6</button><button class="btn" data-level="hard">高 · 7×7</button></div><div class="notice">试玩版为方便观察，右下角会显示每个数字的隐藏类别。正式比赛中不显示类别提示。</div><div class="hint">盘面尺寸按行×列显示；每个内部交点均有旋转按钮。</div></aside>
  </section>
</main>
<script>
const boardEl=document.querySelector('#board'),statusEl=document.querySelector('#status'),timerEl=document.querySelector('#timer'),movesEl=document.querySelector('#moves');
const levels={
easy:{size:5,range:'50以下',minNumber:10,maxNumber:99,divisors:[7,11,13,17,19],steps:[4,7],hints:true,description:'低难度：5类，全为两位数，默认显示分类。每类开局都未完成；保留部分同类相邻块，便于整理。'},
normal:{size:6,range:'50—100',divisors:[53,59,61,67,71,73],steps:[20,40],hints:false,description:'中难度：6类三位数，中度分散，开局无完整类别，默认隐藏分类。'},
hard:{size:7,range:'100—200',divisors:[103,107,109,113,127,131,137],steps:[110,150],hints:false,description:'高难度：7类数字，充分打散，开局没有完整类别区域，默认隐藏分类。'}
};
let currentLevel='normal',divisors=[],pools=[];
const categoryColors=['#45e6bd','#62b5ff','#d392ff','#ffca68','#ff86b6','#a9e56b','#b4a4ff'];
function configure(level){currentLevel=level;const config=levels[level];rows=cols=config.size;divisors=[...config.divisors];const min=config.minNumber??100,max=config.maxNumber??999;pools=divisors.map(d=>Array.from({length:max-min+1},(_,i)=>min+i).filter(n=>n%d===0&&divisors.filter(v=>n%v===0).length===1));showCategories=config.hints;document.querySelector('#categories').textContent=showCategories?'隐藏分类':'显示分类';document.querySelector('.notice').textContent=config.description+' 可以用“显示分类”切换辅助提示；答案与自动解答仅供练习。';document.querySelector('.hint').textContent='分类除数范围：'+config.range+'。每个数字只属于本题一个分类；其他普通因数不作为分类依据。';}
let rows=6,cols=6,state=[],initial=[],history=[],moves=0,running=false,startAt=0,tick=null;
let solved=[],showCategories=true,scramblePath=[],playerPath=[],busy=false,autoSolving=false;
configure(currentLevel);
function build(){let counts=divisors.map(()=>0);for(let n=0;n<rows*cols;n++){let options=counts.map((v,i)=>i).filter(i=>counts[i]<pools[i].length);let min=Math.min(...options.map(i=>counts[i]));let i=options.find(i=>counts[i]===min);counts[i]++}
let cells=[];counts.forEach((count,cls)=>{let pool=[...pools[cls]];for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}for(let i=0;i<count;i++)cells.push({n:pool[i],cls})});
state=Array(rows*cols);cells.forEach((x,i)=>{let r=Math.floor(i/cols),c=i%cols;state[r*cols+(r%2?cols-1-c:c)]=x});
solved=structuredClone(state);scramblePath=[];playerPath=[];
scrambleForDifficulty();
initial=structuredClone(state);history=[];moves=0;render()}
// Grade actual category fragmentation, rather than treating a bigger board as harder.
function difficultyMetrics(){
const seen=new Set(),components=divisors.map(()=>[]);let adjacentPairs=0;
for(let i=0;i<state.length;i++){const r=Math.floor(i/cols),c=i%cols;if(c+1<cols&&state[i].cls===state[i+1].cls)adjacentPairs++;if(r+1<rows&&state[i].cls===state[i+cols].cls)adjacentPairs++;if(seen.has(i))continue;const cls=state[i].cls,stack=[i];seen.add(i);let count=0;while(stack.length){const j=stack.pop(),rr=Math.floor(j/cols),cc=j%cols;count++;for(const [dr,dc]of [[1,0],[-1,0],[0,1],[0,-1]]){const nr=rr+dr,nc=cc+dc,k=nr*cols+nc;if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&!seen.has(k)&&state[k].cls===cls){seen.add(k);stack.push(k)}}}components[cls].push(count);}
return {excess:components.reduce((n,a)=>n+a.length-1,0),largestShare:components.reduce((n,a)=>n+Math.max(...a),0)/state.length,complete:components.filter(a=>a.length===1).length,minComponents:Math.min(...components.map(a=>a.length)),adjacentPairs};
}
function matchesDifficulty(m){
if(currentLevel==='easy')return m.excess>=5&&m.excess<=9&&m.largestShare>=.60&&m.complete===0;
if(currentLevel==='normal')return m.excess>=12&&m.excess<=21&&m.largestShare>=.35&&m.largestShare<=.65&&m.complete===0;
return m.excess>=30&&m.largestShare<=.34&&m.minComponents>=4&&m.complete===0;
}
function scrambleForDifficulty(){
const config=levels[currentLevel];
for(let attempt=0;attempt<300;attempt++){
state=structuredClone(solved);scramblePath=[];
const steps=config.steps[0]+Math.floor(Math.random()*(config.steps[1]-config.steps[0]+1));
for(let step=0;step<steps;step++){
const candidates=[];for(let r=0;r<rows-1;r++)for(let c=0;c<cols-1;c++){const p=r*cols+c,last=scramblePath.at(-1);if(last&&last[0]===r&&last[1]===c)continue;if(new Set([state[p].cls,state[p+1].cls,state[p+cols].cls,state[p+cols+1].cls]).size>1)candidates.push([r,c]);}
const [r,c]=candidates[Math.floor(Math.random()*candidates.length)];rotate(r,c,false);scramblePath.push([r,c]);
}
if(matchesDifficulty(difficultyMetrics()))return;
}
throw new Error('暂未生成符合难度的盘面，请重新换题。');
}
function rotate(r,c,record=true){if(record&&!running)return;let p=r*cols+c,q=p+1,s=p+cols,t=s+1;[state[p],state[q],state[t],state[s]]=[state[s],state[p],state[q],state[t]];if(record){history.push(structuredClone(state));moves++;check();render()}}
function render(){boardEl.style.gridTemplateColumns='repeat('+cols+',1fr)';boardEl.innerHTML='';const completed=divisors.map((_,i)=>connected(i));state.forEach((x,index)=>{let el=document.createElement('div');el.className='cell';let number=document.createElement('span');number.textContent=x.n;number.style.position='relative';number.style.zIndex='1';el.appendChild(number);if(completed[x.cls]){const color=categoryColors[x.cls%categoryColors.length],r=Math.floor(index/cols),c=index%cols;el.style.background='transparent';el.style.borderColor='transparent';el.style.borderRadius='0';const region=document.createElement('div');region.style.cssText='position:absolute;inset:-4.5px;pointer-events:none;background:'+color+'22;';const edges=[['Top',r>0?index-cols:-1],['Bottom',r<rows-1?index+cols:-1],['Left',c>0?index-1:-1],['Right',c<cols-1?index+1:-1]];for(const [side,neighbor] of edges){region.style['border'+side]=(neighbor>=0&&state[neighbor].cls===x.cls)?'none':'3px solid '+color;}el.appendChild(region);}let mini=document.createElement('span');mini.className='mini';mini.hidden=!showCategories;mini.style.zIndex='1';mini.textContent='类 '+(x.cls+1);if(completed[x.cls])mini.style.color=categoryColors[x.cls%categoryColors.length];el.appendChild(mini);boardEl.appendChild(el)});
for(let r=0;r<rows-1;r++)for(let c=0;c<cols-1;c++){let b=document.createElement('button');b.className='rotate-button';b.textContent='↻';b.disabled=!running;b.title='周围四格顺时针旋转90°';b.setAttribute('aria-label','旋转第'+(r+1)+'行第'+(c+1)+'列交点');b.style.left='calc('+((c+1)/cols*100)+'% + '+(((c+1)/cols-.5)*7)+'px)';b.style.top='calc('+((r+1)/rows*100)+'% + '+(((r+1)/rows-.5)*7)+'px)';b.onclick=()=>animatedRotate(r,c);boardEl.appendChild(b)}
movesEl.textContent=moves;document.querySelectorAll('.stat strong')[0].textContent=rows+' × '+cols+'（行×列）';document.querySelectorAll('.stat strong')[1].textContent=divisors.length+' 类';document.querySelector('#undo').disabled=!running||!history.length;document.querySelector('#reset').disabled=!running;document.querySelector('#new').disabled=false}
function connected(cls){let inds=state.map((x,i)=>x.cls===cls?i:-1).filter(i=>i>=0);if(!inds.length)return false;let seen=new Set([inds[0]]),stack=[inds[0]];while(stack.length){let i=stack.pop(),r=Math.floor(i/cols),c=i%cols;for(let [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){let rr=r+dr,cc=c+dc,j=rr*cols+cc;if(rr>=0&&rr<rows&&cc>=0&&cc<cols&&state[j].cls===cls&&!seen.has(j)){seen.add(j);stack.push(j)}}}return seen.size===inds.length}
function check(){if(divisors.every((_,i)=>connected(i))){running=false;clearInterval(tick);statusEl.textContent='通关！所有类别已连通';statusEl.className='status win'}}
function format(ms){return String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')+'.'+Math.floor(ms%1000/100)}
function begin(){clearInterval(tick);running=true;build();startAt=Date.now();timerEl.textContent='00:00.0';statusEl.textContent='进行中：连通全部 '+divisors.length+' 个类别';statusEl.className='status';tick=setInterval(()=>timerEl.textContent=format(Date.now()-startAt),80)}

function lockControls(value){document.querySelectorAll('button').forEach(b=>{if(value){b.dataset.wasDisabled=b.disabled?'1':'0';b.disabled=true}else{b.disabled=b.dataset.wasDisabled==='1';delete b.dataset.wasDisabled}})}
async function animateFour(r,c,duration){
const cells=boardEl.querySelectorAll('.cell'),ids=[r*cols+c,r*cols+c+1,(r+1)*cols+c+1,(r+1)*cols+c];
const a=cells[ids[0]].getBoundingClientRect(),b=cells[ids[2]].getBoundingClientRect(),cx=(a.left+b.right)/2,cy=(a.top+b.bottom)/2;
const animations=ids.map(id=>{const el=cells[id],rect=el.getBoundingClientRect(),x=(rect.left+rect.right)/2-cx,y=(rect.top+rect.bottom)/2-cy;el.style.zIndex='2';const frames=[0,.25,.5,.75,1].map(t=>{let theta=t*Math.PI/2;return {transform:'translate('+(x*Math.cos(theta)-y*Math.sin(theta)-x)+'px,'+(x*Math.sin(theta)+y*Math.cos(theta)-y)+'px)'}});return el.animate(frames,{duration,easing:'ease-in-out'});});
await Promise.all(animations.map(a=>a.finished));}
async function animatedRotate(r,c){if(busy||autoSolving||!running)return;busy=true;lockControls(true);try{await animateFour(r,c,280);playerPath.push([r,c]);rotate(r,c);}finally{lockControls(false);busy=false;render();}}
document.querySelector('#auto').onclick=async()=>{
if(busy||autoSolving)return;
autoSolving=true;busy=true;lockControls(true);clearInterval(tick);statusEl.className='status';statusEl.textContent='自动解答演示中（非最少步数）';
const route=[...scramblePath,...playerPath].reverse();let count=0;
try{for(const [r,c] of route){for(let k=0;k<3;k++){await animateFour(r,c,550);rotate(r,c,false);count++;render();movesEl.textContent=moves+count;document.querySelectorAll('button').forEach(b=>b.disabled=true);await new Promise(resolve=>setTimeout(resolve,200));}}
running=false;statusEl.textContent='自动解答完成：所有类别已连通（演示，不计挑战成绩）';statusEl.className='status win';playerPath=[];history=[];moves+=count;
}finally{autoSolving=false;busy=false;lockControls(false);render();}};

document.querySelector('#categories').onclick=()=>{showCategories=!showCategories;document.querySelector('#categories').textContent=showCategories?'隐藏分类':'显示分类';render()};
document.querySelector('#answer').onclick=()=>{let d=document.createElement('dialog');d.style.cssText='background:#131b31;color:#eef3ff;border:1px solid #62769e;border-radius:18px;padding:24px;max-width:94vw;max-height:92vh;overflow:auto';let h=document.createElement('h2');h.textContent='本题参考答案（合法解不唯一）';d.appendChild(h);let note=document.createElement('p');note.textContent='同类数字连成一片即为合法解。查看答案不改变当前盘面，计时继续。';d.appendChild(note);let grid=document.createElement('div');grid.style.cssText='display:grid;gap:0;grid-template-columns:repeat('+cols+',minmax(38px,70px))';solved.forEach(x=>{let cell=document.createElement('div');cell.style.cssText='padding:12px 3px;text-align:center;font-weight:bold;border:1px solid '+categoryColors[x.cls]+';background:'+categoryColors[x.cls]+'33';cell.textContent=x.n;grid.appendChild(cell)});d.appendChild(grid);let p=document.createElement('p');p.textContent=divisors.map((v,i)=>'类'+(i+1)+'：÷'+v).join('　');d.appendChild(p);let close=document.createElement('button');close.className='btn';close.textContent='关闭，继续作答';close.onclick=()=>d.close();d.appendChild(close);d.onclose=()=>d.remove();document.body.appendChild(d);d.showModal()};
document.querySelector('#start').onclick=begin;document.querySelector('#new').onclick=begin;document.querySelector('#reset').onclick=()=>{state=structuredClone(initial);history=[];playerPath=[];moves=0;render()};document.querySelector('#undo').onclick=()=>{if(!history.length)return;history.pop();playerPath.pop();state=structuredClone(history.length?history[history.length-1]:initial);moves--;render()};
document.querySelectorAll('[data-level]').forEach(b=>{const config=levels[b.dataset.level];b.textContent=({easy:'低',normal:'中',hard:'高'})[b.dataset.level]+' · '+config.size+'×'+config.size;b.title='分类除数：'+config.range;b.onclick=()=>{configure(b.dataset.level);document.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('primary',x===b));begin()}});build();
</script>
</body>
</html>
